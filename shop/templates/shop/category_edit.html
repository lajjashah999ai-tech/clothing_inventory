{% extends 'shop/base.html' %}
{% block title %}Edit Category{% endblock %}
{% block page_title %}Edit Category{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <div class="d-flex align-items-center gap-3 mb-4">
        <a href="{% url 'category_list' %}" class="btn btn-sm" style="background:#f1f5f9;border-radius:8px;color:var(--text);">
          <i class="bi bi-arrow-left"></i>
        </a>
        <h5 class="fw-bold mb-0">Edit Category</h5>
      </div>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Category Name</label>
          {{ form.name }}
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary flex-fill" style="border-radius:10px;">Save Changes</button>
          <a href="{% url 'category_list' %}" class="btn flex-fill" style="background:#f1f5f9;border-radius:10px;color:var(--text);font-weight:500;">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
