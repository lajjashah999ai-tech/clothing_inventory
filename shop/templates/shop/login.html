{% extends 'shop/base.html' %}
{% block title %}Login{% endblock %}

{% block auth_content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #1a1a2e, #16213e);">
  <div class="card shadow-lg border-0" style="width: 100%; max-width: 400px; border-radius: 16px;">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <div class="mb-3" style="font-size: 3rem;">👗</div>
        <h3 class="fw-bold" style="color: #1a1a2e;">Vastradhaga</h3>
        <p class="text-muted small">Clothing Shop Management</p>
      </div>

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-danger py-2 small">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" name="username" class="form-control form-control-lg" autofocus required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control form-control-lg" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100" style="background:#1a1a2e; border-color:#1a1a2e;">
          <i class="bi bi-box-arrow-in-right me-2"></i>Login
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
